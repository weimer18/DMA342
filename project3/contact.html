	<body>
		<header>
			<a href="index.html"
				><img src="img/logo.png" class="logo" alt="Portfolio logo"

			<nav>
				<a href="about.html">About </a>

				<a href="shop.html">Shop</a>
			</nav>

		<main>
			<section>
			<h1>My Contacts:</h1>
			<h2>Email: Name1234@gmail.com
			</h2>
			<h2>Phone Number: (111) 222-3333</h2>
			<h2>Discord: arandomdiscordname_</h2>
			<h2>YouTube: ARandomYouTuber</h2>
			</section>
			<section>
<h3> Have a question? Fill out the form here!</h3>
			
			<form action="https://formspree.io/f/mwloawbk" method="post" id="contact_form">
					<label for="first_name">First name</label>
					<input type="text" name="first_name" id="first_name" autocomplete="given-name" />

					<label for="last_name">Last name</label>
					<input type="text" name="last_name" id="last_name" autocomplete="family-name" />

					<label for="email">Email address</label>

					<input
						type="email"
						name="email"
						id="email"
						autocomplete="email"
						aria-describedby="email_help"
						required
					/>
					<p id="email_help">For example, name@example.com</p>

					<label for="comments">Message</label>
					<textarea name="comments" id="comments" rows="6" required></textarea>
					<label for="quiz">Prove you're human</label>
					<input
						type="text"
						name="quiz"
						id="quiz"
						placeholder="What color is the a cloudless sky?"
						required
					/>
					<button type="submit">Send message</button>
					<input type="hidden" name="_subject" value="New Scoops and Smiles contact message" />
				</form>
		</main>

		<footer>
			<p>©2026 Jake Weimer</p>
		</footer>
		<script>
			const contactForm = document.getElementById('contact_form');
			const quizAnswer = document.getElementById('quiz');
			quizAnswer.addEventListener('input', function () {
				quizAnswer.setCustomValidity('');
			});

			contactForm.addEventListener('submit', function (event) {
				const answer = quizAnswer.value.trim().toLowerCase();

				if (answer !== 'blue') {
					event.preventDefault();
					quizAnswer.setCustomValidity('Please enter the correct answer.');
					quizAnswer.reportValidity();
					quizAnswer.focus();
				}
			});
		</script>
	</body>
</html>
